<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>车小记 · 交互设计原型</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#1c1917;background:#f5f5f4;font-synthesis:none;--green:#065f46;--muted:#57534e;--line:#e7e5e4}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #059669;outline-offset:3px}h1,h2,h3,p{margin:0}h1,h2,h3{text-wrap:balance}p{text-wrap:pretty}button{min-height:44px}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.workspace{max-width:1120px;min-height:100dvh;margin:auto;display:grid;grid-template-columns:1fr 420px;gap:80px;padding:40px 32px;align-items:center}.intro{align-self:center}.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px}.brand-mark{width:44px;height:44px;background:var(--green);color:white;border-radius:16px;display:grid;place-items:center}.eyebrow{font-size:12px;color:var(--green);font-weight:700;margin-top:64px}.intro h1{font-size:48px;line-height:1.25;margin:20px 0 24px;font-weight:650}.intro>p{font-size:16px;line-height:1.9;color:var(--muted);max-width:390px}.features{margin:32px 0;display:grid;gap:18px}.feature{display:flex;align-items:center;gap:14px;font-size:14px;color:var(--muted)}.feature svg{color:var(--green)}.design-note{border-top:1px solid #d6d3d1;padding-top:24px;font-size:12px;color:var(--muted);line-height:1.9}.design-note a{color:var(--green)}.phone{background:#fafaf9;border:1px solid #d6d3d1;border-radius:40px;overflow:hidden;box-shadow:0 20px 25px -5px rgb(0 0 0/.1),0 8px 10px -6px rgb(0 0 0/.1);height:850px;max-height:calc(100dvh - 48px);min-height:640px;display:flex;flex-direction:column}.status{padding:16px 26px 8px;display:flex;justify-content:space-between;font-size:12px;font-weight:700}.app-header{display:flex;justify-content:space-between;align-items:center;padding:8px 24px 14px}.app-header strong{font-size:17px}.capsule{border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:14px;color:#44403c}.content{padding:10px 20px 24px;overflow:auto;flex:1}.demo-badge{background:#e7e5e4;text-align:center;font-size:10px;color:var(--muted);padding:5px}.vehicle-switch{display:flex;justify-content:space-between;align-items:center;margin:4px 0 20px}.vehicle-switch label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}.vehicle-switch select{font-size:19px;font-weight:650;border:0;background:transparent;max-width:270px;color:#1c1917;padding:4px 0;min-height:38px}.energy-tag{font-size:11px;color:var(--green);background:#ecfdf5;border:1px solid #a7f3d0;padding:6px 9px;border-radius:8px}.hero{background:var(--green);color:white;padding:24px;border-radius:24px}.hero-label{color:#d1fae5;font-size:12px;display:flex;justify-content:space-between}.amount{font-size:40px;line-height:1.25;margin:12px 0 18px;font-weight:600;font-variant-numeric:tabular-nums}.amount small{font-size:20px;margin-right:6px;font-weight:400}.hero-bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ffffff30;padding-top:14px;font-size:11px;color:#d1fae5}.hero-bottom button{background:transparent;border:0;color:white;font-size:12px;min-height:28px;padding:0}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px}.metric-label{font-size:11px;color:var(--muted)}.metric-value{font-size:25px;font-weight:650;margin:6px 0;font-variant-numeric:tabular-nums}.metric-value small{font-size:11px;font-weight:400;margin-left:4px}.subtle{font-size:11px;line-height:1.6;color:var(--muted)}.primary{border:0;border-radius:14px;background:var(--green);color:white;padding:12px 18px;font-weight:600;display:flex;justify-content:center;align-items:center;gap:8px;width:100%;min-height:50px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px}.section-title h2{font-size:16px}.text-button{border:0;background:none;color:var(--muted);font-size:12px;padding:0 4px;min-height:32px}.reminder{display:flex;gap:12px;align-items:flex-start}.icon-box{width:40px;height:40px;border-radius:12px;background:#f5f5f4;color:var(--green);display:grid;place-items:center;flex-shrink:0}.row-main{flex:1;min-width:0}.row-title{font-size:13px;font-weight:600;margin-bottom:5px}.row-meta{font-size:11px;color:var(--muted);line-height:1.7}.pill{font-size:10px;padding:4px 7px;background:#f5f5f4;border-radius:6px;white-space:nowrap}.record{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.record:last-child{border-bottom:0}.record-price{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums}.nav{display:grid;grid-template-columns:repeat(4,1fr);background:white;border-top:1px solid var(--line);padding:8px 8px max(16px,env(safe-area-inset-bottom));flex-shrink:0}.nav button{border:0;background:none;color:#78716c;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;padding:4px}.nav button.active{color:var(--green);font-weight:700}.page-heading{font-size:23px;margin:8px 0}.filters{display:flex;gap:8px;margin:18px 0;flex-wrap:wrap}.filter{border:1px solid var(--line);background:white;color:var(--muted);border-radius:10px;padding:7px 12px;min-height:36px;font-size:12px}.filter.active{background:var(--green);color:white;border-color:var(--green)}.stack{display:grid;gap:12px}.large-number{font-size:30px;font-weight:650;margin:12px 0;font-variant-numeric:tabular-nums}.notice{border-left:3px solid #a7f3d0;padding:8px 12px;background:#ecfdf5;font-size:12px;color:#065f46;line-height:1.8;margin:16px 0}.plan-line{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.progress{height:5px;border-radius:10px;background:#e7e5e4;margin:14px 0;overflow:hidden}.progress span{display:block;height:100%;background:var(--green)}.garage-car{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:inherit}.garage-car.selected{border-color:#059669;background:#ecfdf5}.garage-car .row-main{display:block}.garage-car .row-title,.garage-car .row-meta{display:block}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:18px 0}.detail-grid strong{display:block;font-size:16px;margin-top:5px}.chart-row{margin:18px 0}.chart-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}.empty{text-align:center;padding:30px 14px;color:var(--muted);font-size:13px}.empty button{margin-top:16px}dialog{border:1px solid var(--line);border-radius:24px;padding:24px;width:min(390px,calc(100% - 24px));max-height:90dvh;overflow:auto;color:#1c1917}dialog::backdrop{background:rgb(28 25 23/.45)}.dialog-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.dialog-title h2{font-size:20px}.close{background:#f5f5f4;border:0;border-radius:50%;width:44px;height:44px;font-size:23px}.field{display:block;margin:16px 0;font-size:12px}.field input,.field select{display:block;width:100%;margin-top:7px;border:1px solid #d6d3d1;padding:12px;border-radius:10px;background:white;color:#1c1917;min-height:44px}.field input:focus,.field select:focus{outline:2px solid #059669;outline-offset:1px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checkbox{display:flex;gap:8px;align-items:center;font-size:13px;margin:16px 0;min-height:32px}.checkbox input{width:18px;height:18px;accent-color:var(--green)}.error{color:#b91c1c;font-size:12px;line-height:1.5;min-height:18px;margin:8px 0}.toast{min-height:18px;font-size:12px;text-align:center;color:var(--green);padding-top:8px}.record-caption{margin:8px 0 16px} [hidden]{display:none!important}@media(max-width:760px){.workspace{display:block;padding:0;min-height:100dvh}.intro{display:none}.phone{border:0;border-radius:0;height:100dvh;max-height:none;min-height:0;max-width:460px;margin:auto;box-shadow:none}.status{padding-top:max(10px,env(safe-area-inset-top))}.content{padding-bottom:20px}}@media(min-width:761px) and (max-height:800px){.phone{height:740px;min-height:580px}.intro h1{font-size:40px}.eyebrow{margin-top:36px}}
</style>
</head>
<body>
<div class="workspace">
 <aside class="intro">
  <div class="brand"><span class="brand-mark" data-icon="car"></span>车小记</div>
  <div class="eyebrow">YOUR CAR, WELL REMEMBERED</div>
  <h1>每一段里程，<br>都心中有数。</h1>
  <p>加油、充电、保养，还有一路上的小开销。把用车琐事记在一起，把精力留给生活。</p>
  <div class="features"><div class="feature"><span data-icon="bolt"></span>四种能源类型，各有合适的记录方式</div><div class="feature"><span data-icon="chart"></span>看清花费，也看清能耗的计算依据</div><div class="feature"><span data-icon="tool"></span>时间与里程，双重养护提醒</div></div>
  <div class="design-note">微信小程序 · 产品交互方案 / 01<br>右侧可切换车辆、浏览页面并新增示例记录。<br>所有数据为演示，新记录刷新后恢复。<br><a href="DESIGN.md">查看完整产品设计说明 ↗</a></div>
 </aside>
 <main class="phone" aria-label="车小记手机界面原型">
  <div class="status"><span>09:41</span><span>5G ▰</span></div>
  <header class="app-header"><strong>车小记</strong><span class="capsule" aria-hidden="true">••• &nbsp;│&nbsp; ◉</span></header>
  <div class="demo-badge">交互原型 · 示例数据 · 新记录仅本次会话有效</div>
  <div class="content" id="content"></div>
  <nav class="nav" aria-label="主导航"></nav>
 </main>
</div>
<dialog id="entry-dialog" aria-labelledby="entry-title">
 <div class="dialog-title"><h2 id="entry-title">记一笔</h2><button type="button" class="close" aria-label="关闭记录表单">×</button></div>
 <p class="subtle" id="entry-car"></p>
 <form id="entry-form">
  <label class="field">记录类型<select id="entry-kind"></select></label>
  <div class="form-grid"><label class="field">日期<input id="entry-date" type="date" required value="2026-10-09"></label><label class="field">累计里程 · km<input id="entry-mileage" type="number" required min="0" max="9999999" step="1" inputmode="numeric"></label></div>
  <div class="form-grid"><label class="field">实付金额 · 元<input id="entry-cost" type="number" required min="0" max="9999999" step="0.01" inputmode="decimal" placeholder="0.00"></label><label class="field" id="quantity-field"><span id="quantity-label">加油量 · L</span><input id="entry-quantity" type="number" min="0.01" max="99999" step="0.01" inputmode="decimal" placeholder="0.00"></label></div>
  <label class="checkbox" id="full-field"><input type="checkbox" id="entry-full">本次已加满</label>
  <label class="field">项目 / 备注（选填）<input id="entry-note" maxlength="60" placeholder="例如：家充、机油机滤、停车"></label>
  <p class="subtle">示例表单：支持按顺序新增记录。能耗计算、历史补录与计划完成流程见设计说明。</p>
  <p class="error" id="form-error" role="alert"></p>
  <button type="submit" class="primary">保存记录</button>
 </form>
</dialog>
<script>
'use strict';
const paths={car:'<path d="m5 7 2-3h10l2 3 2 3v8h-3v-2H6v2H3v-8z"/><path d="M5 9h14M7 12h1m8 0h1"/>',bolt:'<path d="m13 2-8 12h6l-1 8 9-13h-6z"/>',chart:'<path d="M4 3v17h17M8 15v-4m5 4V7m5 8v-6"/>',tool:'<path d="M14 4a6 6 0 0 0-7 8L3 16a3 3 0 0 0 5 5l5-5a6 6 0 0 0 7-8l-4 4-4-4z"/>',home:'<path d="m3 10 9-7 9 7v11h-7v-7h-4v7H3z"/>',book:'<path d="M5 3h14v18H5zM8 7h8M8 11h8M8 15h4"/>',fuel:'<path d="M4 21V4h9v17M2 21h13M5 9h7m1 3h3v5a2 2 0 0 0 4 0V8l-3-3"/>',plus:'<path d="M12 5v14M5 12h14"/>',check:'<path d="m5 12 4 4L19 6"/>',receipt:'<path d="M5 3h14v18l-3-2-4 2-4-2-3 2zM8 8h8M8 12h8"/>'};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.receipt}</svg>`;
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
const vehicles=[{id:'phev',name:'周末出行 · 插混',type:'插混 / 增程',mile:28640,updated:'2026-10-08',fuel:true,charge:true,volume:24.6,kwh:82.4},{id:'fuel',name:'通勤伙伴 · 燃油',type:'燃油车',mile:42180,updated:'2026-10-07',fuel:true,charge:false,volume:42.8,kwh:0},{id:'ev',name:'城市漫游 · 纯电',type:'纯电车',mile:12860,updated:'2026-10-08',fuel:false,charge:true,volume:0,kwh:126.8},{id:'hev',name:'日常出行 · 双擎',type:'非插电混动',mile:18200,updated:'2026-10-06',fuel:true,charge:false,volume:30.2,kwh:0}];
const kindNames={fuel:'加油',charge:'充电',service:'保养',other:'其他费用'};
let records=[{v:'phev',kind:'charge',date:'2026-10-08',mile:28640,cost:48.8,quantity:41.2,note:'公共充电站'},{v:'phev',kind:'fuel',date:'2026-10-05',mile:28410,cost:192.6,quantity:24.6,note:'92 号汽油',full:true},{v:'phev',kind:'charge',date:'2026-10-03',mile:28260,cost:26.4,quantity:41.2,note:'家充'},{v:'phev',kind:'other',date:'2026-10-02',mile:28210,cost:35,note:'停车费'},{v:'fuel',kind:'fuel',date:'2026-10-07',mile:42180,cost:334.7,quantity:42.8,note:'92 号汽油',full:true},{v:'ev',kind:'charge',date:'2026-10-08',mile:12860,cost:96.8,quantity:126.8,note:'本月充电示例汇总'},{v:'hev',kind:'fuel',date:'2026-10-06',mile:18200,cost:236.2,quantity:30.2,note:'92 号汽油',full:true}];
let current='phev',page='home',filter='all',message='';
const vehicle=()=>vehicles.find(v=>v.id===current);
const money=n=>n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const entries=()=>records.filter(r=>r.v===current).sort((a,b)=>b.date.localeCompare(a.date)||b.mile-a.mile);
const monthly=()=>entries().filter(r=>r.date.startsWith('2026-10'));
const total=()=>monthly().reduce((sum,r)=>sum+r.cost,0);
const sumQuantity=kind=>monthly().filter(r=>r.kind===kind).reduce((sum,r)=>sum+(r.quantity||0),0);
const switcher=()=>`<div class="vehicle-switch"><div><label for="vehicle-select">我的车库 / ${vehicles.length} 辆车</label><select id="vehicle-select" aria-label="切换当前车辆">${vehicles.map(v=>`<option value="${v.id}" ${v.id===current?'selected':''}>${v.name}</option>`).join('')}</select></div><span class="energy-tag">${vehicle().type}</span></div>`;
function rows(items){return items.length?items.map(r=>`<div class="record"><span class="icon-box">${icon(r.kind==='fuel'?'fuel':r.kind==='charge'?'bolt':r.kind==='service'?'tool':'receipt')}</span><div class="row-main"><div class="row-title">${kindNames[r.kind]}${r.quantity?' · '+r.quantity+(r.kind==='fuel'?' L':' kWh'):''}</div><div class="row-meta">${r.date.slice(5).replace('-','/')} · ${escapeText(r.note||kindNames[r.kind])}${r.full?' · 已加满':''}</div></div><span class="record-price">¥${money(r.cost)}</span></div>`).join(''):'<div class="empty">还没有这一类记录<button class="primary" data-add="">记第一笔</button></div>';}
function metric(label,value,unit,caption){return `<div class="card"><div class="metric-label">${label}</div><div class="metric-value">${value}<small>${unit}</small></div><div class="subtle">${caption}</div></div>`;}
function maintenance(){const v=vehicle();const due=v.id==='phev'?30000:v.mile+1360;return `<div class="card reminder"><span class="icon-box">${icon('tool')}</span><div class="row-main"><div class="row-title">${v.fuel?'常规保养':'轮胎与制动检查'}</div><div class="row-meta">11 月 20 日 或 ${due.toLocaleString()} km<br>距记录里程 ${(due-v.mile).toLocaleString()} km · 以先到为准</div></div><span class="pill">自定计划</span></div>`;}
function home(){const v=vehicle();return `${switcher()}<section class="hero"><div class="hero-label"><span>本月已记支出</span><span>2026 年 10 月</span></div><div class="amount"><small>¥</small>${money(total())}</div><div class="hero-bottom"><span>${monthly().length} 笔记录 · 每一笔都有迹可循</span><button data-page="stats">查看统计 ↗</button></div></section><div class="metrics">${v.fuel?metric('本月加油量',sumQuantity('fuel').toFixed(1),'L','油耗待形成完整满箱区间'):metric('本月充电量',sumQuantity('charge').toFixed(1),'kWh','账单充入电量')}${v.fuel&&v.charge?metric('本月充电量',sumQuantity('charge').toFixed(1),'kWh','与燃油量分别记录'):metric(v.fuel?'区间油耗':'区间电耗','—',v.fuel?'L/100km':'kWh/100km',v.fuel?'需要连续的完整加油记录':'需要完整记录与相近起止 SOC')}</div><button class="primary" data-add="">${icon('plus')}记一笔</button><div class="toast" role="status">${escapeText(message)}</div><div class="section-title"><h2>接下来，要记得</h2><button class="text-button" data-page="care">全部提醒 →</button></div>${maintenance()}<div class="section-title"><h2>最近记录</h2><button class="text-button" data-page="ledger">查看账本 →</button></div>${rows(entries().slice(0,3))}`;}
function ledger(){const list=monthly().filter(r=>filter==='all'||r.kind===filter);return `${switcher()}<h1 class="page-heading">用车账本</h1><p class="subtle">2026 年 10 月 · 共 ${monthly().length} 笔 · ¥${money(total())}</p><div class="filters">${['all',...(vehicle().fuel?['fuel']:[]),...(vehicle().charge?['charge']:[]),'service','other'].map(k=>`<button class="filter ${k===filter?'active':''}" data-filter="${k}" aria-pressed="${k===filter}">${k==='all'?'全部':kindNames[k]}</button>`).join('')}</div><div class="card">${rows(list)}</div><p class="subtle record-caption">已记录的支出；不代表车辆全部费用。</p><button class="primary" data-add="">${icon('plus')}记一笔</button>`;}
function care(){return `${switcher()}<h1 class="page-heading">好好养护，安心出发</h1><p class="subtle">时间或里程，任一条件先到就提醒。</p><div class="notice">里程更新于 ${vehicle().updated}：${vehicle().mile.toLocaleString()} km。<br>下次记账可同步新里程，提醒会更准确。</div><div class="stack">${maintenance()}<div class="card"><div class="plan-line"><strong class="row-title">车险续期</strong><span class="pill">提前 30 天提醒</span></div><p class="row-meta">到期日 · 2026 年 12 月 18 日<br>由车主填写的示例日期</p></div><div class="card"><div class="plan-line"><strong class="row-title">空调滤芯检查</strong><span class="pill">按日期</span></div><p class="row-meta">下次检查 · 2027 年 01 月 10 日<br>依据车辆手册调整实际养护计划</p></div></div><div class="section-title"><h2>保养记录</h2></div>${rows(entries().filter(r=>r.kind==='service'))}<button class="primary" data-add="service">${icon('plus')}记录一次保养</button><p class="subtle record-caption">原型仅演示站内提醒；计划编辑、完成后顺延与微信通知在正式版接入。</p>`;}
function garage(){return `<h1 class="page-heading">我的车库</h1><p class="subtle">一车一本账，日常与远方都照顾好。</p><div class="stack" style="margin-top:20px">${vehicles.map(v=>`<button class="card garage-car ${v.id===current?'selected':''}" data-vehicle="${v.id}" aria-pressed="${v.id===current}"><span class="icon-box">${icon('car')}</span><span class="row-main"><span class="row-title">${v.name}</span><span class="row-meta">${v.type} · ${v.mile.toLocaleString()} km</span></span>${v.id===current?icon('check'):''}</button>`).join('')}</div><div class="section-title"><h2>当前车辆档案</h2></div><div class="card"><div class="detail-grid"><div class="subtle">能源类型<strong>${vehicle().type}</strong></div><div class="subtle">累计里程<strong>${vehicle().mile.toLocaleString()} km</strong></div><div class="subtle">里程更新<strong>${vehicle().updated}</strong></div><div class="subtle">数据可见范围<strong>仅自己</strong></div></div></div><div class="notice">这里提供四辆示例车，体验不同能源类型的页面。正式版可自行添加车辆、编辑档案。</div>`;}
function stats(){return `${switcher()}<button class="text-button" data-page="home">← 返回概览</button><h1 class="page-heading">花在哪里，一目了然</h1><p class="subtle">2026 年 10 月 · 当前车辆</p><div class="card" style="margin-top:20px"><p class="subtle">本月已记支出</p><div class="large-number">¥${money(total())}</div>${Object.entries(kindNames).filter(([k])=>!(k==='fuel'&&!vehicle().fuel)&&!(k==='charge'&&!vehicle().charge)).map(([k,n])=>{const sum=monthly().filter(r=>r.kind===k).reduce((s,r)=>s+r.cost,0);return `<div class="chart-row"><div class="chart-label"><span>${n}</span><span>¥${money(sum)}</span></div><div class="progress"><span style="width:${total()?sum/total()*100:0}%"></span></div></div>`;}).join('')}</div><div class="section-title"><h2>关于能耗</h2></div><div class="card"><p class="row-title">记录足够了，再给出可靠的数字</p><p class="row-meta">${vehicle().fuel?'油耗需要两次加满之间的完整加油记录。':''}${vehicle().charge?'电耗需要完整补能记录与可比较的起止电量。':''}${vehicle().fuel&&vehicle().charge?'插混的油耗和电耗分别统计，不直接相加。':''}</p></div><p class="subtle record-caption">此原型演示费用汇总，未接入能耗计算引擎。</p>`;}
function render(){document.getElementById('content').innerHTML=({home,ledger,care,garage,stats}[page])();document.querySelector('.nav').innerHTML=[['home','home','概览'],['ledger','book','账本'],['care','tool','养护'],['garage','car','车辆']].map(([p,i,n])=>`<button data-page="${p}" class="${page===p||(page==='stats'&&p==='home')?'active':''}" ${page===p||(page==='stats'&&p==='home')?'aria-current="page"':''}>${icon(i)}${n}</button>`).join('');}
function navigate(next){page=next;message='';render();document.getElementById('content').scrollTop=0;}
const dialog=document.getElementById('entry-dialog'),form=document.getElementById('entry-form'),kind=document.getElementById('entry-kind');
function updateFields(){const energy=kind.value==='fuel'||kind.value==='charge';document.getElementById('quantity-field').hidden=!energy;document.getElementById('entry-quantity').required=energy;document.getElementById('entry-quantity').disabled=!energy;document.getElementById('quantity-label').textContent=kind.value==='fuel'?'加油量 · L':'充入电量 · kWh';document.getElementById('full-field').hidden=kind.value!=='fuel';}
function openEntry(selected){form.reset();const v=vehicle();kind.innerHTML=[...(v.fuel?['fuel']:[]),...(v.charge?['charge']:[]),'service','other'].map(k=>`<option value="${k}">${kindNames[k]}</option>`).join('');if(selected)kind.value=selected;document.getElementById('entry-car').textContent=v.name+' · '+v.type;document.getElementById('entry-mileage').value=v.mile;document.getElementById('form-error').textContent='';updateFields();dialog.showModal();}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.page)navigate(el.dataset.page);if(el.hasAttribute('data-add'))openEntry(el.dataset.add);if(el.dataset.filter){filter=el.dataset.filter;render();}if(el.dataset.vehicle){current=el.dataset.vehicle;filter='all';render();}if(el.classList.contains('close'))dialog.close();});
document.addEventListener('change',e=>{if(e.target.id==='vehicle-select'){current=e.target.value;filter='all';message='';render();}if(e.target===kind)updateFields();});
form.addEventListener('submit',e=>{e.preventDefault();const v=vehicle(),date=document.getElementById('entry-date').value,mile=Number(document.getElementById('entry-mileage').value),cost=Number(document.getElementById('entry-cost').value),quantity=Number(document.getElementById('entry-quantity').value);const error=document.getElementById('form-error');if(date<'2026-10-01'||date>'2026-10-09'){error.textContent='此原型演示 2026 年 10 月，请选择 10 月 1 日至 9 日。';return;}if(date<v.updated||mile<v.mile){error.textContent=`请按顺序记录：日期不早于 ${v.updated}，里程不小于 ${v.mile} km。历史补录将在正式版支持。`;return;}const energy=kind.value==='fuel'||kind.value==='charge';records.push({v:current,kind:kind.value,date,mile,cost,quantity:energy?quantity:undefined,full:kind.value==='fuel'&&document.getElementById('entry-full').checked,note:document.getElementById('entry-note').value.trim()});v.mile=mile;v.updated=date;dialog.close();page='home';message='已保存，本月账本已更新';render();document.getElementById('content').scrollTop=0;});
render();
</script>
</body>
</html>
